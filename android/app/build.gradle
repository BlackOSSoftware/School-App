apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"
apply plugin: "com.google.gms.google-services"

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    autolinkLibrariesWithApp()
    enableSoCleanup = false
}

def staleSourceAssetFiles = [
    file("$projectDir/src/main/assets/index.android.bundle"),
    file("$projectDir/src/main/assets/index.android.bundle.map"),
]

tasks.register("removeStaleSourceBundles") {
    doLast {
        staleSourceAssetFiles.each { staleFile ->
            if (staleFile.exists()) {
                staleFile.delete()
            }
        }
    }
}

tasks.matching { it.name == "preBuild" }.configureEach {
    dependsOn("removeStaleSourceBundles")
}

// Ensure codegen artifacts exist even after a Clean Project before native clean runs.
// Only wire tasks that actually exist to avoid stale/manual references.
def codegenTaskSpecs = [
    [projectPath: ":react-native-community_datetimepicker", taskName: "generateCodegenArtifactsFromSchema"],
    [projectPath: ":react-native-documents_picker", taskName: "generateCodegenArtifactsFromSchema"],
    [projectPath: ":react-native-vector-icons_ionicons", taskName: "generateCodegenArtifactsFromSchema"],
]
def resolvedCodegenTasks = codegenTaskSpecs.collectMany { spec ->
    def proj = findProject(spec.projectPath)
    if (proj == null) {
        return []
    }
    def matching = proj.tasks.matching { it.name == spec.taskName }
    return matching.isEmpty() ? [] : ["${spec.projectPath}:${spec.taskName}"]
}
tasks.matching { it.name == "externalNativeBuildCleanDebug" || it.name == "externalNativeBuildCleanRelease" }
    .configureEach {
        if (!resolvedCodegenTasks.isEmpty()) {
            dependsOn(resolvedCodegenTasks)
        }
    }

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = true
def enableSeparateBuildPerCPUArchitecture = true
def requestedTaskNames = gradle.startParameter.taskNames.collect { it.toLowerCase() }
def defaultArchitectures = requestedTaskNames.any { it.contains("release") }
    ? "armeabi-v7a,arm64-v8a"
    : "armeabi-v7a,arm64-v8a,x86,x86_64"
def configuredArchitectures = (findProperty("reactNativeArchitectures") ?: defaultArchitectures)
    .toString()
    .split(",")
    .collect { it.trim() }
    .findAll { it }

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = io.github.react-native-community:jsc-android-intl:2026004.+`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.schoolapp"
    defaultConfig {
        applicationId "com.schoolapp"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            if (
                project.hasProperty('MYAPP_UPLOAD_STORE_FILE') &&
                project.hasProperty('MYAPP_UPLOAD_STORE_PASSWORD') &&
                project.hasProperty('MYAPP_UPLOAD_KEY_ALIAS') &&
                project.hasProperty('MYAPP_UPLOAD_KEY_PASSWORD')
            ) {
                storeFile file("../${MYAPP_UPLOAD_STORE_FILE}")
                storePassword MYAPP_UPLOAD_STORE_PASSWORD
                keyAlias MYAPP_UPLOAD_KEY_ALIAS
                keyPassword MYAPP_UPLOAD_KEY_PASSWORD
            } else {
                // Local fallback for quick testing when release keystore is not configured.
                initWith(signingConfigs.debug)
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }

    splits {
        abi {
            enable enableSeparateBuildPerCPUArchitecture
            reset()
            include(*configuredArchitectures)
            universalApk false
        }
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")
    // RN 0.84 bridgeless host initializes Hermes runtime by default.
    // Keep Hermes native libs packaged even when hermesEnabled=false, otherwise
    // app crashes at startup with missing `libhermestooling.so` on release.
    implementation("com.facebook.react:hermes-android")

    if (hermesEnabled.toBoolean()) {
        // no-op: Hermes runtime already included above
    } else {
        implementation jscFlavor
    }
}
