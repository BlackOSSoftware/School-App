org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m
org.gradle.java.home=C:\\Program Files\\Eclipse Adoptium\\jdk-17.0.18.8-hotspot

android.useAndroidX=true
# Use this property to specify which architecture you want to build.
# You can also override it from the CLI using
# ./gradlew <task> -PreactNativeArchitectures=x86_64
reactNativeArchitectures=armeabi-v7a,arm64-v8a,x86,x86_64

# Keep new architecture disabled in local debug for faster/stable emulator startup.
# This avoids common blank-screen-on-launch stalls on slower AVDs.
newArchEnabled=false

# Use this property to enable or disable the Hermes JS engine.
# If set to false, you will be using JSC instead.
# Hermes compiler (hermesc) is missing on this Windows install.
# Disable Hermes to use JSC and allow release APK bundling to succeed.
hermesEnabled=false
# Keep React Gradle plugin in sync with Hermes setting.
react.hermesEnabled=false
edgeToEdgeEnabled=false

MYAPP_UPLOAD_STORE_FILE=schoolapp-release-key.keystore
MYAPP_UPLOAD_KEY_ALIAS=schoolapp-key-alias
MYAPP_UPLOAD_STORE_PASSWORD=school
MYAPP_UPLOAD_KEY_PASSWORD=school
